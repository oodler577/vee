name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          test "$(sh bin/vee -v)" = "${TAG#v}"
          test -f "docs/releases/$TAG.md"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          sh -n install.sh
          sh -n uninstall.sh
      - name: Upload assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            test "$draft" = true || { echo 'Release already published; refusing to replace its assets.' >&2; exit 1; }
            gh release upload "$TAG" install.sh uninstall.sh --clobber
          else
            gh release create "$TAG" install.sh uninstall.sh --draft --verify-tag --title "vee ${TAG#v}" --notes-file "docs/releases/$TAG.md"
          fi
          gh release edit "$TAG" --draft=false --latest
